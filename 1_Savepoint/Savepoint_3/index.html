<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;
    const { LineChart, Line, XAxis, YAxis, ResponsiveContainer, Tooltip, AreaChart, Area } = Recharts;

    const PANEL_KW = 0.4; // kW per panel at STC
    const BASE_PANELS_F1 = 40; // Farm 01 Fixed Tilt
    const BASE_PANELS_F2 = 30; // Farm 02 Tracking Array
    const MAX_PANELS = 120;
    const MIN_PANELS = 10;

    const TRANSMISSION_LOSS_F1 = 4.5;
    const TRANSMISSION_LOSS_F2 = 3.8;

    const STATION_BASE_CAPACITY_KWH = 60;
    const STATION_BASE_CHARGE_RATE_KW = 8;
    const MODULE_CAPACITY_KWH = 30;
    const MODULE_CHARGE_RATE_KW = 4;
    const MAX_MODULES = 4;
    const STATION_LOAD_KW = 1.2; // station cooling & electronics load
    const CHARGE_EFFICIENCY = 0.92;
    const INVERTER_EFFICIENCY = 0.978;

    const REAL_TICK_MS = 1000;
    const SPEEDS = [
      { label: "Real-time", minPerTick: 1 / 60 },
      { label: "1 min / s", minPerTick: 1 },
      { label: "5 min / s", minPerTick: 5 },
      { label: "15 min / s", minPerTick: 15 },
      { label: "1 hr / s", minPerTick: 60 },
    ];

    const TIME_PRESETS = [
      { label: "Dawn (06:00)", hour: 6.0 },
      { label: "Midday Noon (12:00)", hour: 12.0 },
      { label: "Fleet Rush (17:30)", hour: 17.5 },
      { label: "Golden Dusk (18:30)", hour: 18.5 },
      { label: "Nightfall (21:00)", hour: 21.0 },
      { label: "Midnight (00:00)", hour: 0.0 }
    ];

    const WEATHER_PRESETS = [
      { label: "☀️ Clear Sky", temp: 28, hum: 40, cloud: 5 },
      { label: "⛅ Scattered Clouds", temp: 26, hum: 55, cloud: 45 },
      { label: "⛈ Heavy Storm", temp: 20, hum: 92, cloud: 88 },
      { label: "🔥 Extreme Heat", temp: 43, hum: 15, cloud: 0 },
      { label: "🌫 Dense Haze / Soiling", temp: 31, hum: 75, cloud: 60 }
    ];

    const DEPOT_COORDS = { lat: 18.5204, lng: 73.8738 };

    function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

    function computeFarm01Output(panels, tempC, humidity, cloudCover, hourOfDay, soilingFactor = 1.0) {
      let sunElevation = Math.sin(((hourOfDay - 6) / 12) * Math.PI);
      if (hourOfDay < 6 || hourOfDay > 18) sunElevation = 0;
      sunElevation = Math.max(0, sunElevation);

      const cloudFactor = 1 - (cloudCover / 100) * 0.85;
      const humidityFactor = 1 - (humidity / 100) * 0.15;
      let tempFactor = 1;
      if (tempC > 25) tempFactor = 1 - (tempC - 25) * 0.004;
      else if (tempC < 10) tempFactor = 1 - (10 - tempC) * 0.01;
      tempFactor = clamp(tempFactor, 0.5, 1.05);

      const rawGrossKw = panels * PANEL_KW * sunElevation * cloudFactor * humidityFactor * tempFactor * soilingFactor;
      return Math.max(0, rawGrossKw * INVERTER_EFFICIENCY);
    }

    function computeFarm02Output(panels, tempC, humidity, cloudCover, hourOfDay, soilingFactor = 1.0) {
      let trackerElevation = Math.sin(((hourOfDay - 5.5) / 13) * Math.PI);
      if (hourOfDay < 5.5 || hourOfDay > 18.5) trackerElevation = 0;
      trackerElevation = Math.max(0, Math.pow(trackerElevation, 0.72));

      const cloudFactor = 1 - (cloudCover / 100) * 0.82;
      const humidityFactor = 1 - (humidity / 100) * 0.12;
      let tempFactor = 1;
      if (tempC > 25) tempFactor = 1 - (tempC - 25) * 0.0035;
      tempFactor = clamp(tempFactor, 0.55, 1.05);
      const bifacialAlbedoGain = 1.08;

      const rawGrossKw = panels * PANEL_KW * trackerElevation * cloudFactor * humidityFactor * tempFactor * soilingFactor * bifacialAlbedoGain;
      return Math.max(0, rawGrossKw * INVERTER_EFFICIENCY);
    }

    function tempAtHour(hour, noise) { return clamp(22 + 9 * Math.sin(((hour - 6) / 24) * 2 * Math.PI) + noise, 4, 46); }
    function humidityAtHour(hour, noise) { return clamp(60 - 25 * Math.sin(((hour - 6) / 24) * 2 * Math.PI) + noise, 5, 98); }
    function cloudDrift(prev, noise) { return clamp(prev + noise, 0, 100); }
    function fmtClock(hour) {
      const h = Math.floor(hour) % 24;
      const m = Math.floor((hour % 1) * 60);
      return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
    }
    function pointAlongTrack(track, progress) {
      const scaled = clamp(progress, 0, 1) * (track.length - 1);
      const index = Math.min(Math.floor(scaled), track.length - 2);
      const fraction = scaled - index;
      const start = track[index];
      const end = track[index + 1];
      return {
        lat: start[0] + (end[0] - start[0]) * fraction,
        lng: start[1] + (end[1] - start[1]) * fraction
      };
    }

    function SolarBatterySwapPlatform() {
      // Navigation Console: 'solar' (Solar & Grid Room) | 'fleet' (Fleet & Battery Swap Station)
        const [consoleView, setConsoleView] = useState("solar");

      // 1. Time Machine & Speeds
      const [simMinutes, setSimMinutes] = useState(9 * 60); // start at 09:00 AM
      const [speedIdx, setSpeedIdx] = useState(2); // default 5 min / s
      const [paused, setPaused] = useState(false);

      // 2. Weather & Atmosphere
      const [autoWeather, setAutoWeather] = useState(true);
      const [tempC, setTempC] = useState(28);
      const [humidity, setHumidity] = useState(45);
      const [cloudCover, setCloudCover] = useState(15);
      const [soilingLoss, setSoilingLoss] = useState(2);

      // 3. Two Solar Farms & Central Substation BESS
      const [panelsF1, setPanelsF1] = useState(BASE_PANELS_F1);
      const [panelsF2, setPanelsF2] = useState(BASE_PANELS_F2);
      const [modules, setModules] = useState(1);
      const [storedKwh, setStoredKwh] = useState(STATION_BASE_CAPACITY_KWH * 0.45);
      const [dispatchMode, setDispatchMode] = useState("AUTO");

      // 4. Station Spare Battery Swap Rack (4 Modular Packs in Station Rack)
      // When solar is free/idle, station charges these spare packs so they are 100% ready for night or instant swap!
      const [stationBatteryRack, setStationBatteryRack] = useState([
        { id: "P-01", name: "Spare Pack A", soc: 100, capKwh: 30, chargeRateKw: 6, status: "Ready for Swap (100%)" },
        { id: "P-02", name: "Spare Pack B", soc: 100, capKwh: 30, chargeRateKw: 6, status: "Ready for Swap (100%)" },
        { id: "P-03", name: "Spare Pack C", soc: 75, capKwh: 30, chargeRateKw: 6, status: "Recharging in Rack" },
        { id: "P-04", name: "Spare Pack D", soc: 40, capKwh: 30, chargeRateKw: 6, status: "Recharging in Rack" },
      ]);

      // 5. 3 Delivery Trucks (Dual Facility: Direct Cable Fast Charging OR Instant Swap)
      const [truckBays, setTruckBays] = useState([
        { id: 1, name: "Hauler Alpha (Truck-01)", connected: true, chargeMode: "DIRECT_CABLE", soc: 45, targetSoc: 90, chargeRateKw: 25, batteryCapKwh: 100, status: "Direct DC Cable Charging", opStatus: "Charging", currentOrder: null, lat: DEPOT_COORDS.lat, lng: DEPOT_COORDS.lng, routeProgress: 0, dwellTicks: 0 },
        { id: 2, name: "Hauler Bravo (Truck-02)", connected: true, chargeMode: "DIRECT_CABLE", soc: 70, targetSoc: 90, chargeRateKw: 20, batteryCapKwh: 100, status: "Direct DC Cable Charging", opStatus: "Charging", currentOrder: null, lat: DEPOT_COORDS.lat, lng: DEPOT_COORDS.lng, routeProgress: 0, dwellTicks: 0 },
        { id: 3, name: "Hauler Charlie (Truck-03)", connected: false, chargeMode: "IDLE", soc: 90, targetSoc: 90, chargeRateKw: 0, batteryCapKwh: 100, status: "Ready for dispatch", opStatus: "Available", currentOrder: null, lat: DEPOT_COORDS.lat, lng: DEPOT_COORDS.lng, routeProgress: 0, dwellTicks: 0 }
      ]);

      const [autoFleetSchedule, setAutoFleetSchedule] = useState(true);
      const [swapsCompleted, setSwapsCompleted] = useState(12);
      const [fleetDispatchLog, setFleetDispatchLog] = useState([
        { id: 1, time: "08:45", truck: "Hauler Bravo", action: "Queued for direct charge", priority: "Medium" },
        { id: 2, time: "09:10", truck: "Hauler Charlie", action: "Queued for swap fallback", priority: "High" },
      ]);
      const [orders, setOrders] = useState([
        { id: "ORD-1042", customer: "North Market", lat: 18.535, lng: 73.875, load: "Fresh produce", status: "Ready", assignedTruck: null, age: 0, track: [[18.5204,73.8738],[18.524,73.874],[18.528,73.872],[18.531,73.874],[18.535,73.875]] },
        { id: "ORD-1043", customer: "Riverfront Clinic", lat: 18.505, lng: 73.848, load: "Medical supplies", status: "Ready", assignedTruck: null, age: 0, track: [[18.5204,73.8738],[18.516,73.869],[18.512,73.862],[18.508,73.855],[18.505,73.848]] },
        { id: "ORD-1044", customer: "East Industrial Park", lat: 18.515, lng: 73.905, load: "Solar components", status: "Ready", assignedTruck: null, age: 0, track: [[18.5204,73.8738],[18.519,73.882],[18.518,73.891],[18.516,73.898],[18.515,73.905]] },
      ]);
      const mapRef = useRef(null);
      const mapInstanceRef = useRef(null);

      // Grid Telemetry
      const [gridFreqHz, setGridFreqHz] = useState(50.00);
      const [bessTempC, setBessTempC] = useState(26.5);
      const [totalGeneratedKwh, setTotalGeneratedKwh] = useState(210.0);
      const [curtailedTotalKwh, setCurtailedTotalKwh] = useState(1.6);
      const [totalFleetDeliveredKwh, setTotalFleetDeliveredKwh] = useState(115.0);

      // AI & Terminal
      const [advisories, setAdvisories] = useState([]);
      const [advisoryLoading, setAdvisoryLoading] = useState(false);
      const [flowPulse, setFlowPulse] = useState(0);
      const [operatorQuery, setOperatorQuery] = useState("");
      const [history, setHistory] = useState([]);

      const prevOutputRef = useRef(0);
      const inFlightRef = useRef(false);
      const lastAutoMinuteRef = useRef(-9999);

      const hourOfDay = (simMinutes / 60) % 24;
      const isNight = hourOfDay < 5.5 || hourOfDay >= 19;
      const stationCapacityKwh = STATION_BASE_CAPACITY_KWH + modules * MODULE_CAPACITY_KWH;
      const stationChargeRateKw = STATION_BASE_CHARGE_RATE_KW + modules * MODULE_CHARGE_RATE_KW;

      // 2 Solar Farms Calculations
      const f1OutputKw = computeFarm01Output(panelsF1, tempC, humidity, cloudCover, hourOfDay, 1 - (soilingLoss / 100));
      const f1LossKw = f1OutputKw * (TRANSMISSION_LOSS_F1 / 100);
      const f1GridInputKw = f1OutputKw - f1LossKw;

      const f2OutputKw = computeFarm02Output(panelsF2, tempC, humidity, cloudCover, hourOfDay, 1 - (soilingLoss / 100));
      const f2LossKw = f2OutputKw * (TRANSMISSION_LOSS_F2 / 100);
      const f2GridInputKw = f2OutputKw - f2LossKw;

      const totalGenerationKw = f1OutputKw + f2OutputKw;
      const totalDeliveredToStationKw = f1GridInputKw + f2GridInputKw;
      const stationPct = (storedKwh / stationCapacityKwh) * 100;

      // Power Demands:
      // 1. Direct Cable Charging Demand from Trucks
      const directTruckDemandKw = truckBays.reduce((sum, t) => sum + (t.connected && t.soc < t.targetSoc ? t.chargeRateKw : 0), 0);
      
      // 2. Rack Battery Charging Demand (In free time / sunny hours, spare packs recharge from station power)
      const rackRechargeDemandKw = stationBatteryRack.reduce((sum, p) => sum + (p.soc < 100 ? p.chargeRateKw : 0), 0);

      // Total Load on Substation = Station Electronics (1.2 kW) + Direct Truck Cable (kW) + Spare Rack Recharging (kW)
      const totalStationLoadKw = STATION_LOAD_KW + directTruckDemandKw + rackRechargeDemandKw;
      const netPowerKw = totalDeliveredToStationKw - totalStationLoadKw;

      let chargeKw = 0;
      let dischargeKw = 0;
      let curtailedKw = 0;

      if (dispatchMode === "PEAK_SHAVING" && isNight && storedKwh > 10) {
        const peakExport = Math.min(15, stationChargeRateKw);
        dischargeKw = Math.min(peakExport + totalStationLoadKw, stationChargeRateKw);
      } else if (netPowerKw >= 0) {
        // Solar covers all trucks + spare battery rack, and excess charges main BESS buffer
        if (storedKwh >= stationCapacityKwh) {
          curtailedKw = netPowerKw;
          chargeKw = 0;
        } else {
          chargeKw = Math.min(netPowerKw, stationChargeRateKw);
          curtailedKw = netPowerKw - chargeKw;
        }
      } else {
        // Deficit supplied by BESS buffer
        const deficit = -netPowerKw;
        dischargeKw = Math.min(deficit, stationChargeRateKw);
      }

      // Carbon Accounting & Financials
      const co2AvoidedKg = (totalGeneratedKwh * 0.42).toFixed(1);
      const revenueUsd = (totalGeneratedKwh * 0.14 + totalFleetDeliveredKwh * 0.22).toFixed(2);

      // AI Advisor & Operator Logic
      const askAdvisor = useCallback(async (customTriggerText = null) => {
        if (inFlightRef.current) return;
        inFlightRef.current = true;
        setAdvisoryLoading(true);

        const currentTimeStr = fmtClock(hourOfDay);
        const reason = customTriggerText || "routine diagnostic sweep";

        try {
          let adviceText = "";
          if (customTriggerText && customTriggerText.startsWith("USER:")) {
            const query = customTriggerText.replace("USER:", "").trim().toLowerCase();
            if (query.includes("swap") || query.includes("rack") || query.includes("battery")) {
              const fullPacks = stationBatteryRack.filter(p => p.soc >= 98).length;
              adviceText = `Battery Swap Station has ${fullPacks}/4 spare packs at 100% SoC ready for instant truck swaps. In idle time, rack draws ${rackRechargeDemandKw.toFixed(1)} kW to recharge depleted packs.`;
            } else if (query.includes("fleet") || query.includes("truck") || query.includes("charge")) {
              adviceText = `Trucks drawing ${directTruckDemandKw.toFixed(1)} kW via direct cable. ${totalDeliveredToStationKw >= totalStationLoadKw ? "100% clean solar powering all trucks and recharging spare packs simultaneously." : `BESS buffer discharging at ${dischargeKw.toFixed(1)} kW to maintain charging speed.`}`;
            } else if (query.includes("night") || query.includes("endurance")) {
              const netDraw = totalStationLoadKw;
              const enduranceHours = netDraw > 0 ? (storedKwh / netDraw) : 99;
              adviceText = `BESS storage holds ${storedKwh.toFixed(1)} kWh (${stationPct.toFixed(0)}%). Endurance under current load is approx ${enduranceHours.toFixed(1)} hours. Fully charged spare packs provide additional backup.`;
            } else {
              adviceText = `All systems nominal: 2 Farms generating ${totalGenerationKw.toFixed(1)} kW, Direct Truck draw: ${directTruckDemandKw.toFixed(1)} kW, Rack Recharge: ${rackRechargeDemandKw.toFixed(1)} kW, BESS SoC: ${stationPct.toFixed(0)}%.`;
            }
          } else {
            // Autonomous event evaluations
            const readyPacks = stationBatteryRack.filter(p => p.soc >= 98).length;
            if (readyPacks === 0 && directTruckDemandKw > 30) {
              adviceText = `All spare battery packs are currently depleted/charging. Recommending direct cable charging until spare rack packs reach 100%.`;
            } else if (curtailedKw > 1.0) {
              adviceText = `Solar surplus (${totalGenerationKw.toFixed(1)} kW). Free energy is actively recharging station spare battery packs in the rack.`;
            } else if (stationPct >= 94) {
              adviceText = `Substation BESS saturated at ${stationPct.toFixed(0)}%. Storage and spare battery rack are 100% primed for evening/night transport demands.`;
            } else if (isNight) {
              adviceText = `Night operations: Zero solar generation. Trucks utilizing charged spare battery packs and BESS storage (${storedKwh.toFixed(1)} kWh remaining).`;
            } else {
              adviceText = `Operations synchronized at ${currentTimeStr}. Solar: ${totalGenerationKw.toFixed(1)} kW. Powering station loads & charging spare battery packs.`;
            }
          }

          await new Promise(r => setTimeout(r, 250));
          setAdvisories(prev => [{
            id: Date.now(),
            time: currentTimeStr,
            text: adviceText,
            reason: customTriggerText ? "Operator Query" : reason
          }, ...prev].slice(0, 8));
        } catch (e) {
          setAdvisories(prev => [{
            id: Date.now(),
            time: currentTimeStr,
            text: "AI Operations coordinator telemetry active.",
            reason: "diagnostic"
          }, ...prev].slice(0, 8));
        } finally {
          setAdvisoryLoading(false);
          inFlightRef.current = false;
        }
      }, [hourOfDay, storedKwh, stationPct, stationCapacityKwh, stationChargeRateKw, curtailedKw, modules, totalGenerationKw, totalDeliveredToStationKw, f1OutputKw, f2OutputKw, directTruckDemandKw, rackRechargeDemandKw, totalStationLoadKw, stationBatteryRack, isNight, dispatchMode, dischargeKw, gridFreqHz]);

      // Simulation Tick: Charges connected trucks & recharges spare battery packs in rack
      useEffect(() => {
        if (paused) return;
        const minPerTick = SPEEDS[speedIdx].minPerTick;
        const interval = setInterval(() => {
          setSimMinutes(m => m + minPerTick);
          setFlowPulse(p => (p + 1) % 1000);
          setGridFreqHz(50.0 + (Math.random() - 0.5) * 0.04);
          setBessTempC(25 + (storedKwh / stationCapacityKwh) * 5 + (chargeKw > 4 || dischargeKw > 20 ? 2.5 : 0) + (Math.random() - 0.5) * 0.3);

          const dtHours = minPerTick / 60;

          // 1. Direct Cable Charging Progression for connected trucks
          setTruckBays(bays => bays.map(bay => {
            if (bay.connected && bay.chargeMode === "DIRECT_CABLE" && bay.soc < bay.targetSoc) {
              const addedKwh = bay.chargeRateKw * dtHours;
              const newSoc = clamp(bay.soc + (addedKwh / bay.batteryCapKwh) * 100, 0, bay.targetSoc);
              return {
                ...bay,
                soc: newSoc,
                status: newSoc >= bay.targetSoc ? "Direct Cable Full (Ready to Depart)" : bay.status
              };
            }
            // Auto schedule evening truck arrival at 17:30
            if (autoFleetSchedule && hourOfDay >= 17.5 && hourOfDay <= 18.5 && !bay.connected && bay.id === 3) {
              return { ...bay, connected: true, chargeMode: "DIRECT_CABLE", soc: 18, status: "Direct Cable Charging (Evening Depot Rush)" };
            }
            return bay;
          }));

          // 2. Spare Battery Rack Background Recharging (In free time / idle hours)
          setStationBatteryRack(rack => rack.map(pack => {
            if (pack.soc < 100) {
              const addedKwh = pack.chargeRateKw * dtHours * CHARGE_EFFICIENCY;
              const newSoc = clamp(pack.soc + (addedKwh / pack.capKwh) * 100, 0, 100);
              return {
                ...pack,
                soc: newSoc,
                status: newSoc >= 100 ? "Ready for Swap (100%)" : `Recharging (${pack.chargeRateKw} kW from Station)`
              };
            }
            return pack;
          }));

        }, REAL_TICK_MS);
        return () => clearInterval(interval);
      }, [paused, speedIdx, storedKwh, stationCapacityKwh, chargeKw, dischargeKw, autoFleetSchedule, hourOfDay]);

      // Weather Auto-Drift
      useEffect(() => {
        if (!autoWeather) return;
        setTempC(tempAtHour(hourOfDay, (Math.random() - 0.5) * 1.2));
        setHumidity(humidityAtHour(hourOfDay, (Math.random() - 0.5) * 2.5));
        setCloudCover(prev => cloudDrift(prev, (Math.random() - 0.5) * 5));
      }, [simMinutes, autoWeather, hourOfDay]);

      // Energy Accounting
      useEffect(() => {
        const minPerTick = SPEEDS[speedIdx].minPerTick;
        const dt = (paused ? 0 : minPerTick) / 60;

        if (totalGenerationKw > 0 && dt > 0) setTotalGeneratedKwh(g => g + totalGenerationKw * dt);
        if (curtailedKw > 0 && dt > 0) setCurtailedTotalKwh(c => c + curtailedKw * dt);
        if (directTruckDemandKw > 0 && dt > 0) setTotalFleetDeliveredKwh(f => f + directTruckDemandKw * dt);

        setStoredKwh(prev => {
          let delta = 0;
          if (chargeKw > 0) delta = chargeKw * dt * CHARGE_EFFICIENCY;
          else if (dischargeKw > 0) delta = -dischargeKw * dt;
          return clamp(prev + delta, 0, stationCapacityKwh);
        });

        setHistory(h => [...h, {
          t: fmtClock(hourOfDay),
          f1: Number(f1OutputKw.toFixed(2)),
          f2: Number(f2OutputKw.toFixed(2)),
          totalSolar: Number(totalGenerationKw.toFixed(2)),
          truckDirect: Number(directTruckDemandKw.toFixed(2)),
          rackRecharge: Number(rackRechargeDemandKw.toFixed(2)),
          battery: Number(storedKwh.toFixed(1)),
        }].slice(-36));
      }, [simMinutes, f1OutputKw, f2OutputKw, totalGenerationKw, directTruckDemandKw, rackRechargeDemandKw, chargeKw, dischargeKw, curtailedKw, stationCapacityKwh, paused, speedIdx, hourOfDay]);

      // Controls & Actions
      const jumpToHour = h => {
        const dayBase = Math.floor(simMinutes / 1440) * 1440;
        setSimMinutes(dayBase + h * 60);
      };

      const stepMinutes = mins => setSimMinutes(m => Math.max(0, m + mins));

      const applyWeatherPreset = preset => {
        setAutoWeather(false);
        setTempC(preset.temp);
        setHumidity(preset.hum);
        setCloudCover(preset.cloud);
      };

      const handleOperatorSubmit = (e) => {
        e.preventDefault();
        if (!operatorQuery.trim()) return;
        askAdvisor(`USER:${operatorQuery}`);
        setOperatorQuery("");
      };

      // 1. Direct Cable Plug/Unplug Action
      const toggleDirectCable = bayId => {
        const targetTruck = truckBays.find(truck => truck.id === bayId);
        if (targetTruck && targetTruck.opStatus && !["Available", "Charging"].includes(targetTruck.opStatus)) return;
        setTruckBays(bays => bays.map(b => {
          if (b.id === bayId) {
            const nextConnected = !b.connected;
            return {
              ...b,
              connected: nextConnected,
              opStatus: nextConnected ? "Charging" : "Available",
              chargeMode: nextConnected ? "DIRECT_CABLE" : "IDLE",
              chargeRateKw: nextConnected ? (b.chargeRateKw || 25) : 0,
              status: nextConnected ? "Direct DC Cable Charging" : "Bay Available (Unplugged)"
            };
          }
          return b;
        }));
      };

      // 2. Robotic Battery Swap Action (Swaps empty truck battery with a 100% full pack from the station rack)
      const performRoboticSwap = bayId => {
        const targetTruck = truckBays.find(b => b.id === bayId);
        if (targetTruck?.opStatus && !["Available", "Charging"].includes(targetTruck.opStatus)) return;
        // Find a 100% full pack in the station rack
        const fullPackIndex = stationBatteryRack.findIndex(p => p.soc >= 98);
        if (fullPackIndex === -1) {
          alert("⚠️ No 100% fully charged spare battery packs available in the station rack! Please wait for rack packs to recharge or use Direct Cable Fast Charging.");
          return;
        }

        const oldTruckSoc = targetTruck ? targetTruck.soc : 20;

        // Swap: Truck gets 100% pack, and the depleted pack goes into the station rack to recharge!
        setStationBatteryRack(rack => rack.map((p, idx) => {
          if (idx === fullPackIndex) {
            return {
              ...p,
              soc: clamp(oldTruckSoc, 10, 35),
              status: `Recharging Swapped Pack (${p.chargeRateKw} kW from Station)`
            };
          }
          return p;
        }));

        setTruckBays(bays => bays.map(b => {
          if (b.id === bayId) {
            return {
              ...b,
              connected: true,
              opStatus: "Charging",
              chargeMode: "SWAPPED_FULL",
              soc: 100,
              status: "Swapped with 100% Fresh Station Pack (Ready to Deliver!)"
            };
          }
          return b;
        }));

        setSwapsCompleted(c => c + 1);
        askAdvisor(`Robotic Battery Swap executed for Bay #${bayId}! 100% fresh pack installed; depleted pack placed on station charging rack.`);
      };

      const flowActive = totalDeliveredToStationKw > 0.05;
      const dischargeActive = dischargeKw > 0 && isNight;
      const dashOffset = -(flowPulse % 40);
      const isDuskDawn = (hourOfDay >= 5.5 && hourOfDay <= 7) || (hourOfDay >= 17.5 && hourOfDay <= 19);

      const commandQueue = [...truckBays]
        .map(truck => {
          const readyPackCount = stationBatteryRack.filter(pack => pack.soc >= 98).length;
          const urgency = truck.soc < 25 ? 100 : truck.soc < 45 ? 80 : truck.soc < 65 ? 60 : 40;
          const queueWeight = truck.connected ? 0 : 25;
          const decision = readyPackCount > 0 && truck.soc < 35 ? "SWAP" : "DIRECT_CHARGE";
          const reason = truck.soc < 25
            ? "Critical battery reserve"
            : truck.soc < 45
              ? "Low SoC queue"
              : truck.connected
                ? "Already in service"
                : "Scheduled for dispatch";

          return {
            ...truck,
            urgency: urgency + queueWeight,
            decision,
            reason,
            eta: truck.connected ? "In service" : "Awaiting assignment"
          };
        })
        .sort((a, b) => b.urgency - a.urgency);

      const commandCenterSummary = {
        readyPacks: stationBatteryRack.filter(pack => pack.soc >= 98).length,
        queueDepth: orders.filter(order => order.status === "Ready").length,
        activeOrders: orders.filter(order => !["Ready", "Complete"].includes(order.status)).length,
        criticalCount: commandQueue.filter(truck => truck.soc < 30).length,
        recommendedAction: commandQueue.some(truck => truck.soc < 30)
          ? "Prioritize low-SoC trucks and reserve ready packs for swap"
          : "Maintain scheduled charging and top-up BESS when solar allows"
      };

      const handlePriorityDispatch = (truckId) => {
        const targetTruck = truckBays.find(truck => truck.id === truckId);
        if (!targetTruck) return;

        const readyPackAvailable = stationBatteryRack.some(pack => pack.soc >= 98);
        const preferredMode = readyPackAvailable && targetTruck.soc < 35 ? "SWAP" : "DIRECT";

        const actionText = preferredMode === "SWAP" ? "assigned to robotic swap" : "assigned to direct cable charge";
        const priorityText = targetTruck.soc < 30 ? "Critical" : targetTruck.soc < 50 ? "High" : "Medium";

        setFleetDispatchLog(prev => [{
          id: Date.now(),
          time: fmtClock(hourOfDay),
          truck: targetTruck.name,
          action: actionText,
          priority: priorityText
        }, ...prev].slice(0, 6));

        if (preferredMode === "SWAP") {
          performRoboticSwap(truckId);
        } else {
          toggleDirectCable(truckId);
        }
      };

      const markTruckServed = (truckId) => {
        setTruckBays(bays => bays.map(truck => {
          if (truck.id !== truckId) return truck;
          return {
            ...truck,
            connected: false,
            chargeMode: "IDLE",
            status: "Bay Ready for Next Dispatch",
            soc: Math.min(100, truck.soc + 5),
            chargeRateKw: 0
          };
        }));

        setFleetDispatchLog(prev => [{
          id: Date.now(),
          time: fmtClock(hourOfDay),
          truck: `Truck-${truckId}`,
          action: "service cycle complete",
          priority: "Routine"
        }, ...prev].slice(0, 6));
      };
      const dispatchOrder = orderId => {
        const availableTruck = truckBays.find(truck => truck.opStatus === "Available" || !truck.opStatus);
        if (!availableTruck) return;

        setOrders(currentOrders => currentOrders.map(order => order.id === orderId
          ? { ...order, status: "Dispatched", assignedTruck: availableTruck.id, age: 0 }
          : order
        ));
        setTruckBays(bays => bays.map(truck => truck.id === availableTruck.id
          ? { ...truck, opStatus: "Outbound", currentOrder: orderId, connected: false, chargeMode: "IDLE", chargeRateKw: 0, status: `Outbound to ${orderId}`, lat: DEPOT_COORDS.lat, lng: DEPOT_COORDS.lng, routeProgress: 0, dwellTicks: 0 }
          : truck
        ));
        setFleetDispatchLog(prev => [{
          id: Date.now(), time: fmtClock(hourOfDay), truck: availableTruck.name, action: `Dispatched for ${orderId}`, priority: "Active"
        }, ...prev].slice(0, 6));
      };

      // The operational loop advances live GPS positions, deliveries, returns, and depot charging.
      useEffect(() => {
        if (paused) return;
        const interval = setInterval(() => {
          setTruckBays(bays => bays.map(truck => {
            const activeOrder = orders.find(order => order.id === truck.currentOrder);
            if (truck.opStatus === "Outbound" && activeOrder) {
              const nextProgress = clamp(truck.routeProgress + 0.08, 0, 1);
              const position = pointAlongTrack(activeOrder.track, nextProgress);
              return {
                ...truck,
                routeProgress: nextProgress,
                lat: position.lat,
                lng: position.lng,
                soc: clamp(truck.soc - 0.8, 0, 100),
                opStatus: nextProgress >= 1 ? "At customer" : "Outbound",
                status: nextProgress >= 1 ? `Delivered ${truck.currentOrder}` : `En route to ${truck.currentOrder}`,
                dwellTicks: 0
              };
            }
            if (truck.opStatus === "At customer" && activeOrder) {
              const dwellTicks = truck.dwellTicks + 1;
              return dwellTicks >= 4
                ? { ...truck, opStatus: "Returning", status: "Returning to depot", dwellTicks: 0 }
                : { ...truck, dwellTicks, status: `Loading / unloading at ${activeOrder.customer}` };
            }
            if (truck.opStatus === "Returning" && activeOrder) {
              const nextProgress = clamp(truck.routeProgress - 0.08, 0, 1);
              const position = pointAlongTrack(activeOrder.track, nextProgress);
              return {
                ...truck,
                routeProgress: nextProgress,
                lat: position.lat,
                lng: position.lng,
                soc: clamp(truck.soc - 0.8, 0, 100),
                opStatus: nextProgress <= 0 ? "Charging" : "Returning",
                connected: nextProgress <= 0,
                chargeMode: nextProgress <= 0 ? "DIRECT_CABLE" : "IDLE",
                chargeRateKw: nextProgress <= 0 ? 25 : 0,
                status: nextProgress <= 0 ? "Returned to depot; charging" : "Returning to depot"
              };
            }
            if (truck.opStatus === "Charging" && truck.soc >= 85) return { ...truck, opStatus: "Available", currentOrder: null, connected: false, chargeMode: "IDLE", chargeRateKw: 0, lat: DEPOT_COORDS.lat, lng: DEPOT_COORDS.lng, status: "Available for next order" };
            return truck;
          }));
          setOrders(currentOrders => currentOrders.map(order => {
            const assignedTruck = truckBays.find(truck => truck.currentOrder === order.id);
            if (assignedTruck?.opStatus === "At customer") return { ...order, status: "Delivered", age: order.age + 1 };
            if (assignedTruck?.opStatus === "Returning") return { ...order, status: "Returning", age: order.age + 1 };
            if (order.status === "Returning" && !assignedTruck) return { ...order, status: "Complete", age: order.age + 1 };
            return order.status === "Ready" ? order : { ...order, age: order.age + 1 };
          }));
        }, 1000);
        return () => clearInterval(interval);
      }, [paused, orders, truckBays]);

      // Render the live depot, customers, routes, and truck positions on a real Leaflet map.
      useEffect(() => {
        const mapElement = mapRef.current;
        if (consoleView !== "ops" || !mapElement || !window.L) {
          if (mapInstanceRef.current) {
            mapInstanceRef.current.remove();
            mapInstanceRef.current = null;
          }
          return;
        }

        // React replaces the map DOM node when switching console windows.
        // Reuse is only safe while Leaflet is attached to this exact element.
        if (mapInstanceRef.current && mapInstanceRef.current.getContainer() !== mapElement) {
          mapInstanceRef.current.remove();
          mapInstanceRef.current = null;
        }

        if (!mapInstanceRef.current) {
          mapInstanceRef.current = window.L.map(mapElement, { zoomControl: true }).setView([18.5204, 73.8738], 12.5);
          const primaryTiles = window.L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
            attribution: "&copy; OpenStreetMap contributors",
            maxZoom: 19
          }).addTo(mapInstanceRef.current);
          let fallbackLoaded = false;
          primaryTiles.on("tileerror", () => {
            if (fallbackLoaded) return;
            fallbackLoaded = true;
            window.L.tileLayer("https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png", {
              attribution: "&copy; OpenStreetMap contributors, Tiles style by HOT",
              maxZoom: 19
            }).addTo(mapInstanceRef.current);
          });
        }
        const map = mapInstanceRef.current;
        map.invalidateSize();
        map.eachLayer(layer => {
          if (layer instanceof window.L.Marker || layer instanceof window.L.Polyline || layer instanceof window.L.Tooltip) map.removeLayer(layer);
        });

        const depot = [DEPOT_COORDS.lat, DEPOT_COORDS.lng];
        window.L.marker(depot, { icon: window.L.divIcon({ className: "", html: '<div class="map-marker depot">⚡</div>', iconSize: [30, 30], iconAnchor: [15, 15] }) })
          .addTo(map)
          .bindPopup("Meridian Dispatch Depot • Solar + BESS + Battery Swap Station")
          .bindTooltip("MERIDIAN DISPATCH + CHARGING", { permanent: true, direction: "top", offset: [0, -14], className: "depot-label" });

        orders.forEach(order => {
          const marker = window.L.marker([order.lat, order.lng], { icon: window.L.divIcon({ className: "", html: '<div class="map-marker customer">●</div>', iconSize: [30, 30], iconAnchor: [15, 15] }) }).addTo(map);
          marker.bindPopup(`<strong>${order.id}</strong><br/>${order.customer}<br/>${order.load}<br/>Status: ${order.status}`);
          const assignedTruck = truckBays.find(truck => truck.currentOrder === order.id);
          if (assignedTruck && order.status !== "Complete") {
            const routeColor = assignedTruck.opStatus === "Returning" ? "#F5A623" : assignedTruck.opStatus === "At customer" ? "#4ADE80" : "#60A5FA";
            window.L.polyline(order.track.map(point => [point[0], point[1]]), { color: routeColor, weight: 4, opacity: 0.85, dashArray: assignedTruck.opStatus === "At customer" ? undefined : "8 8" }).addTo(map);
          }
        });

        truckBays.forEach(truck => {
          const position = [truck.lat || DEPOT_COORDS.lat, truck.lng || DEPOT_COORDS.lng];
          const popupPosition = `${position[0].toFixed(5)}, ${position[1].toFixed(5)}`;
          window.L.marker(position, { icon: window.L.divIcon({ className: "", html: '<div class="map-marker truck">🚚</div>', iconSize: [30, 30], iconAnchor: [15, 15] }) })
            .addTo(map).bindPopup(`<strong>${truck.name}</strong><br/>${truck.opStatus || "Available"}<br/>SoC: ${truck.soc.toFixed(0)}%<br/>GPS: ${popupPosition}`);
        });
      }, [consoleView, orders, truckBays]);

      return (
        <div style={{ maxWidth: "1520px", margin: "0 auto", padding: "18px 24px" }}>
          
          {/* Top Mission Control Strip */}
          <div style={{
            display: "flex", alignItems: "center", justifyContent: "space-between",
            padding: "14px 20px", background: "#0A1017", border: "1px solid #162230",
            borderRadius: "10px", marginBottom: "16px", flexWrap: "wrap", gap: "14px"
          }}>
            <div style={{ display: "flex", alignItems: "center", gap: "14px" }}>
              <div style={{ width: "12px", height: "12px", borderRadius: "3px", background: "#F5A623", boxShadow: "0 0 12px #F5A62388" }} />
              <div>
                <div style={{ display: "flex", alignItems: "center", gap: "10px" }}>
                  <h1 style={{ fontSize: "19px", fontWeight: 700, margin: 0, color: "#EDF1F5" }}>
                    MERIDIAN SOLAR & BATTERY SWAP LOGISTICS STATION
                  </h1>
                  <span className="badge" style={{ background: "rgba(245,166,35,0.15)", color: "#F5A623", border: "1px solid rgba(245,166,35,0.4)" }}>
                    DUAL CHARGING & SWAP
                  </span>
                </div>
                <div style={{ fontSize: "11px", color: "#6B7A8C", marginTop: "2px" }}>
                  2 Solar Farms • Substation GS-01 • Direct Cable + Rapid Battery Swap Terminal
                </div>
              </div>
            </div>

            {/* Triple Console Navigation */}
            <div style={{ display: "flex", gap: "8px" }}>
              <button
                className={`btn-nav ${consoleView === "solar" ? "active-solar" : ""}`}
                onClick={() => setConsoleView("solar")}
              >
                <span>☀️</span> Solar & Grid Room
              </button>
              <button
                className={`btn-nav ${consoleView === "battery" ? "active-battery" : ""}`}
                onClick={() => setConsoleView("battery")}
              >
                <span>🔋</span> Battery Swap Station
              </button>
              <button
                className={`btn-nav ${consoleView === "queue" ? "active-queue" : ""}`}
                onClick={() => setConsoleView("queue")}
              >
                <span>🚚</span> Queue Manager
              </button>
              <button
                className={`btn-nav ${consoleView === "ops" ? "active-ops" : ""}`}
                onClick={() => setConsoleView("ops")}
              >
                <span>🗺️</span> Fleet Operations Map
              </button>
            </div>

            {/* Live Summary */}
            <div style={{ display: "flex", alignItems: "center", gap: "16px", fontSize: "12px" }}>
              <div>
                <span style={{ color: "#6B7A8C" }}>Solar Gen: </span>
                <span className="mono" style={{ color: "#F5A623", fontWeight: 700 }}>{totalGenerationKw.toFixed(1)} kW</span>
              </div>
              <div>
                <span style={{ color: "#6B7A8C" }}>Total Station Load: </span>
                <span className="mono" style={{ color: "#2DD4BF", fontWeight: 700 }}>{totalStationLoadKw.toFixed(1)} kW</span>
              </div>
              <div>
                <span style={{ color: "#6B7A8C" }}>BESS Buffer: </span>
                <span className="mono" style={{ color: "#4ADE80", fontWeight: 700 }}>{stationPct.toFixed(0)}%</span>
              </div>
            </div>
          </div>

          {/* Time Machine & Solar Trajectory Controller */}
          <div className="control-card" style={{ marginBottom: "18px" }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: "14px", marginBottom: "14px" }}>
              
              <div style={{ display: "flex", alignItems: "center", gap: "12px" }}>
                <div style={{
                  background: isNight ? "#141F2D" : "rgba(245,166,35,0.15)",
                  border: `1px solid ${isNight ? "#243547" : "rgba(245,166,35,0.4)"}`,
                  borderRadius: "8px", padding: "6px 12px", display: "flex", alignItems: "center", gap: "8px"
                }}>
                  <span style={{ fontSize: "16px" }}>{isNight ? "🌙" : isDuskDawn ? "🌅" : "☀️"}</span>
                  <span className="mono" style={{ fontSize: "22px", fontWeight: 700, color: "#EDF1F5" }}>
                    {fmtClock(hourOfDay)}
                  </span>
                  <span style={{ fontSize: "11px", color: "#6B7A8C" }}>Day {Math.floor(simMinutes / 1440) + 1}</span>
                </div>

                <div style={{ display: "flex", gap: "4px" }}>
                  <button className="btn-preset" onClick={() => stepMinutes(-60)}>-1h</button>
                  <button className="btn-preset" onClick={() => stepMinutes(-15)}>-15m</button>
                  <button className="btn-preset" onClick={() => stepMinutes(15)}>+15m</button>
                  <button className="btn-preset" onClick={() => stepMinutes(60)}>+1h</button>
                </div>
              </div>

              <div style={{ display: "flex", alignItems: "center", gap: "6px", flexWrap: "wrap" }}>
                <span style={{ fontSize: "11px", color: "#6B7A8C", marginRight: "4px" }}>Jump:</span>
                {TIME_PRESETS.map(p => (
                  <button
                    key={p.label}
                    className={`btn-preset ${Math.abs(hourOfDay - p.hour) < 0.25 ? "active" : ""}`}
                    onClick={() => jumpToHour(p.hour)}
                  >
                    {p.label}
                  </button>
                ))}
              </div>

              <div style={{ display: "flex", alignItems: "center", gap: "5px" }}>
                <span style={{ fontSize: "11px", color: "#6B7A8C", marginRight: "4px" }}>Speed:</span>
                {SPEEDS.map((s, i) => (
                  <button
                    key={s.label}
                    className={`btn-preset ${speedIdx === i && !paused ? "active" : ""}`}
                    onClick={() => { setSpeedIdx(i); setPaused(false); }}
                  >
                    {s.label}
                  </button>
                ))}
                <button
                  className="btn-preset"
                  style={{ borderColor: paused ? "#F87171" : "#243547", color: paused ? "#F87171" : undefined }}
                  onClick={() => setPaused(p => !p)}
                >
                  {paused ? "▶ Resume" : "⏸ Pause"}
                </button>

                          >
                            🔄 Robotic Battery Swap
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* Station Battery Swap Inventory Rack (Spare Packs) */}
                <div className="control-card">
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "14px" }}>
                    <div>
                      <span style={{ fontSize: "13px", fontWeight: 700, color: "#F5A623", textTransform: "uppercase" }}>
                        🔋 Station Battery Swap Rack (4 Packs)
                      </span>
                      <div style={{ fontSize: "11px", color: "#6B7A8C", marginTop: "2px" }}>
                        Recharges spare packs during free/sunny hours
                      </div>
                    </div>
                  </div>

                  <div style={{ display: "flex", flexDirection: "column", gap: "10px" }}>
                    {stationBatteryRack.map(pack => (
                      <div key={pack.id} className={`pack-slot ${pack.soc >= 98 ? "full" : "charging"}`}>
                        <div>
                          <div style={{ fontSize: "13px", fontWeight: 600, color: "#EDF1F5" }}>{pack.name} ({pack.id})</div>
                          <div style={{ fontSize: "10px", color: pack.soc >= 98 ? "#4ADE80" : "#2DD4BF", marginTop: "2px" }}>
                            {pack.status}
                          </div>
                        </div>
                        <div style={{ textAlign: "right" }}>
                          <div className="mono" style={{ fontSize: "16px", color: pack.soc >= 98 ? "#4ADE80" : "#F5A623", fontWeight: 700 }}>
                            {pack.soc.toFixed(0)}%
                          </div>
                          <div style={{ fontSize: "9px", color: "#6B7A8C" }}>{pack.capKwh} kWh pack</div>
                        </div>
                      </div>
                    ))}
                  </div>

                  <div style={{ marginTop: "16px", padding: "12px", background: "#060A10", borderRadius: "6px", border: "1px solid #141F2D" }}>
                    <div style={{ fontSize: "11px", color: "#8E9EAF", fontWeight: 600, marginBottom: "4px" }}>
                      ⚙️ How Free-Time Charging Works:
                    </div>
                    <div style={{ fontSize: "11px", color: "#6B7A8C", lineHeight: 1.5 }}>
                      When solar output exceeds direct truck demand, the station actively pumps electricity into depleted spare packs in the rack. Once full (100%), they sit ready on standby for night-shift trucks or instant 2-minute robotic swaps.
                    </div>
                  </div>
                </div>

              </div>

            </div>
          )}

          {/* VIEW 3: QUEUE MANAGER */}
          {consoleView === "queue" && (
            <div style={{ display: "flex", flexDirection: "column", gap: "18px" }}>
              <div className="control-card" style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: "12px" }}>
                <div>
                  <div style={{ fontSize: "12px", fontWeight: 700, color: "#EDF1F5", textTransform: "uppercase" }}>Queue Manager</div>
                  <div style={{ fontSize: "11px", color: "#6B7A8C", marginTop: "2px" }}>Prioritized fleet assignments and bay dispatch guidance</div>
                </div>
                <div style={{ display: "flex", alignItems: "center", gap: "8px" }}>
                  <span className="mono" style={{ fontSize: "11px", color: "#2DD4BF" }}>{commandCenterSummary.queueDepth} in queue</span>
                  <span className="mono" style={{ fontSize: "11px", color: "#F5A623" }}>{commandCenterSummary.criticalCount} critical</span>
                </div>
              </div>

              <div style={{ display: "grid", gridTemplateColumns: "repeat(3, minmax(0, 1fr))", gap: "12px" }}>
                {commandQueue.slice(0, 3).map(truck => (
                  <div key={truck.id} style={{ background: "#070C12", border: "1px solid #172737", borderRadius: "8px", padding: "10px 12px" }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "8px" }}>
                      <div>
                        <div style={{ fontSize: "12px", fontWeight: 700, color: "#EDF1F5" }}>{truck.name}</div>
                        <div style={{ fontSize: "10px", color: "#6B7A8C", marginTop: "2px" }}>{truck.reason}</div>
                        <div className="mono" style={{ fontSize: "9px", color: "#536476", marginTop: "3px" }}>{truck.opStatus || "Available"} · {truck.lat.toFixed(4)}, {truck.lng.toFixed(4)}</div>
                      </div>
                      <span className="mono" style={{ fontSize: "11px", color: truck.soc < 30 ? "#F87171" : "#2DD4BF", fontWeight: 700 }}>
                        {truck.soc.toFixed(0)}%
                      </span>
                    </div>

                    <div style={{ display: "flex", justifyContent: "space-between", fontSize: "10px", color: "#8E9EAF", marginBottom: "8px" }}>
                      <span>Priority</span>
                      <span className="mono" style={{ color: "#F5A623" }}>{truck.urgency}</span>
                    </div>

                    <div style={{ display: "flex", justifyContent: "space-between", fontSize: "10px", color: "#8E9EAF", marginBottom: "10px" }}>
                      <span>Recommended</span>
                      <span className="mono" style={{ color: truck.decision === "SWAP" ? "#F5A623" : "#2DD4BF" }}>
                        {truck.decision === "SWAP" ? "Swap" : "Direct charge"}
                      </span>
                    </div>

                    <button
                      className="btn-preset"
                      style={{ width: "100%", borderColor: truck.decision === "SWAP" ? "#F5A623" : "#2DD4BF", color: truck.decision === "SWAP" ? "#F5A623" : "#2DD4BF" }}
                      onClick={() => handlePriorityDispatch(truck.id)}
                    >
                      {truck.decision === "SWAP" ? "Dispatch swap" : "Dispatch charge"}
                    </button>
                  </div>
                ))}
              </div>

              <div style={{ padding: "10px 12px", background: "#070C12", borderRadius: "8px", border: "1px solid #172737", fontSize: "11px", color: "#8E9EAF", lineHeight: 1.6 }}>
                <strong style={{ color: "#EDF1F5" }}>Current dispatch guidance:</strong> {commandCenterSummary.recommendedAction}
              </div>

              <div style={{ display: "grid", gridTemplateColumns: "repeat(2, minmax(0, 1fr))", gap: "12px" }}>
                {truckBays.map(truck => (
                  <button
                    key={truck.id}
                    onClick={() => markTruckServed(truck.id)}
                    style={{
                      background: "#090E16",
                      border: "1px solid #172737",
                      borderRadius: "8px",
                      color: "#EDF1F5",
                      cursor: "pointer",
                      fontSize: "11px",
                      padding: "10px 12px",
                      textAlign: "left"
                    }}
                  >
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                      <span style={{ fontWeight: 700 }}>{truck.name}</span>
                      <span className="mono" style={{ color: "#2DD4BF" }}>{truck.soc.toFixed(0)}%</span>
                    </div>
                    <div style={{ color: "#8E9EAF", marginTop: "4px" }}>Mark service complete</div>
                  </button>
                ))}
              </div>

              <div style={{ display: "flex", flexDirection: "column", gap: "8px" }}>
                <div style={{ fontSize: "11px", color: "#8E9EAF", textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: "2px" }}>Recent dispatch log</div>
                {fleetDispatchLog.map(entry => (
                  <div key={entry.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", background: "#070C12", border: "1px solid #172737", borderRadius: "6px", padding: "8px 10px", fontSize: "11px" }}>
                    <div style={{ display: "flex", gap: "8px", alignItems: "center" }}>
                      <span className="mono" style={{ color: "#2DD4BF" }}>{entry.time}</span>
                      <span style={{ color: "#EDF1F5", fontWeight: 600 }}>{entry.truck}</span>
                    </div>
                    <div style={{ display: "flex", gap: "10px", alignItems: "center" }}>
                      <span style={{ color: "#8E9EAF" }}>{entry.action}</span>
                      <span className="mono" style={{ color: entry.priority === "Critical" ? "#F87171" : entry.priority === "High" ? "#F5A623" : "#4ADE80" }}>{entry.priority}</span>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* VIEW 4: LIVE FLEET OPERATIONS MAP */}
          {consoleView === "ops" && (
            <div style={{ display: "flex", flexDirection: "column", gap: "18px" }}>
              <div className="control-card" style={{ display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: "12px" }}>
                <div>
                  <div style={{ fontSize: "12px", fontWeight: 700, color: "#EDF1F5", textTransform: "uppercase" }}>Live Fleet Operations</div>
                  <div style={{ fontSize: "11px", color: "#6B7A8C", marginTop: "2px" }}>Orders move from depot dispatch to delivery, return, and solar-powered charging</div>
                </div>
                <div style={{ display: "flex", gap: "14px", fontSize: "11px" }}>
                  <span className="mono" style={{ color: "#60A5FA" }}>{orders.filter(order => order.status === "Ready").length} ready</span>
                  <span className="mono" style={{ color: "#2DD4BF" }}>{commandCenterSummary.activeOrders} active</span>
                  <span className="mono" style={{ color: "#4ADE80" }}>{orders.filter(order => ["Delivered", "Complete"].includes(order.status)).length} delivered</span>
                </div>
              </div>

              <div style={{ display: "grid", gridTemplateColumns: "minmax(0, 1.7fr) minmax(300px, 0.8fr)", gap: "18px", alignItems: "start" }}>
                <div className="control-card" style={{ padding: "10px" }}>
                  <div ref={mapRef} className="ops-map" />
                  <div style={{ display: "flex", gap: "14px", flexWrap: "wrap", padding: "10px 4px 2px", fontSize: "10px", color: "#8E9EAF" }}>
                    <span><span style={{ color: "#F5A623" }}>●</span> Meridian depot</span>
                    <span><span style={{ color: "#2DD4BF" }}>●</span> Fleet vehicle</span>
                    <span><span style={{ color: "#60A5FA" }}>●</span> Customer order</span>
                    <span>Dashed route = active delivery</span>
                    <span>Free OpenStreetMap tiles · no API key</span>
                  </div>
                </div>

                <div style={{ display: "flex", flexDirection: "column", gap: "12px" }}>
                  <div className="control-card">
                    <div style={{ fontSize: "11px", color: "#8E9EAF", textTransform: "uppercase", marginBottom: "10px" }}>Incoming orders</div>
                    <div style={{ display: "flex", flexDirection: "column", gap: "8px" }}>
                      {orders.map(order => {
                        const assignedTruck = truckBays.find(truck => truck.id === order.assignedTruck);
                        const canDispatch = order.status === "Ready" && truckBays.some(truck => truck.opStatus === "Available" || !truck.opStatus);
                        return (
                          <div key={order.id} style={{ background: "#070C12", border: "1px solid #172737", borderRadius: "7px", padding: "9px" }}>
                            <div style={{ display: "flex", justifyContent: "space-between", gap: "8px" }}>
                              <div>
                                <div style={{ color: "#EDF1F5", fontSize: "12px", fontWeight: 700 }}>{order.id} · {order.customer}</div>
                                <div style={{ color: "#6B7A8C", fontSize: "10px", marginTop: "3px" }}>{order.load}</div>
                                <div className="mono" style={{ color: "#536476", fontSize: "9px", marginTop: "3px" }}>Pickup: Meridian Dispatch Depot</div>
                              </div>
                              <span className="mono" style={{ color: order.status === "Ready" ? "#60A5FA" : order.status === "Delivered" ? "#4ADE80" : "#F5A623", fontSize: "10px" }}>{order.status}</span>
                            </div>
                            {assignedTruck && <div style={{ color: "#8E9EAF", fontSize: "10px", marginTop: "6px" }}>{assignedTruck.name} · {assignedTruck.opStatus}</div>}
                            {canDispatch && <button className="btn-preset" style={{ width: "100%", marginTop: "8px", borderColor: "#60A5FA", color: "#60A5FA" }} onClick={() => dispatchOrder(order.id)}>Dispatch next available truck</button>}
                          </div>
                        );
                      })}
                    </div>
                  </div>

                  <div className="control-card">
                    <div style={{ fontSize: "11px", color: "#8E9EAF", textTransform: "uppercase", marginBottom: "10px" }}>Fleet state</div>
                    <div style={{ display: "flex", flexDirection: "column", gap: "8px" }}>
                      {truckBays.map(truck => (
                        <div key={truck.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: "8px", paddingBottom: "7px", borderBottom: "1px solid #172737" }}>
                          <div>
                            <div style={{ color: "#EDF1F5", fontSize: "11px", fontWeight: 700 }}>{truck.name}</div>
                            <div style={{ color: "#6B7A8C", fontSize: "10px", marginTop: "2px" }}>{truck.status}</div>
                          </div>
                          <span className="mono" style={{ color: truck.opStatus === "Charging" ? "#F5A623" : truck.opStatus === "Available" || !truck.opStatus ? "#4ADE80" : "#2DD4BF", fontSize: "10px" }}>{truck.opStatus || "Available"}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<SolarBatterySwapPlatform />);
  </script>
</body>
</html>
