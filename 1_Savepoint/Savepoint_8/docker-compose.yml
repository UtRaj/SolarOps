services:
  # Web Frontend (React 19 + Vite + Express proxy)
  web:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - API_URL=http://api:8000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - api
    restart: unless-stopped

  # Backend REST API (FastAPI)
  api:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://solarops:solarops_secret@postgres:5432/solarops_db
      - REDIS_URL=redis://redis:6379/0
      - NATS_URL=nats://nats:4222
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    restart: unless-stopped

  # Background Workers (NATS Event Consumers & Outbox Publisher)
  worker:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile.api
    command: python -m apps.worker.main
    environment:
      - ENVIRONMENT=development
      - DATABASE_URL=postgresql+asyncpg://solarops:solarops_secret@postgres:5432/solarops_db
      - REDIS_URL=redis://redis:6379/0
      - NATS_URL=nats://nats:4222
    depends_on:
      - postgres
      - nats
    restart: unless-stopped

  # PostgreSQL Transactional Database
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=solarops
      - POSTGRES_PASSWORD=solarops_secret
      - POSTGRES_DB=solarops_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solarops -d solarops_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis In-Memory Cache & Distributed Lock Store
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # NATS JetStream Durable Event Broker
  nats:
    image: nats:2.10-alpine
    ports:
      - "4222:4222"
      - "8222:8222"
    command: ["-js", "-m", "8222"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
